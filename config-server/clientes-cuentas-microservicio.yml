spring:
  application:
    name: clientes-cuentas-microservicio
feign:
  circuitbreaker:
    enabled: true
  client:
    config:
      default:
        connectTimeout: 2000
        readTimeout: 5000
        loggerLevel: full
resilience4j:
  circuitbreaker:
    instances:
      clientes-cuentas-microservicio:
        slidingWindowSize: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 5s
  timelimiter:
    instances:
      clientes-cuentas-microservicio:
        timeoutDuration: 2s
  bulkhead:
    instances:
      clientes-cuentas-microservicio:
        maxConcurrentCalls: 10
        maxWaitDuration: 0