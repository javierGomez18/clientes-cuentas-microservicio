server:
  port: 8080
eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://eureka-server:8761/eureka
spring:
  datasource:
    url: jdbc:postgresql://postgres:5432/clientes_cuentas
    username: admin
    password: admin
    driver-class-name: org.postgresql.Driver
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        highlight_sql: true
        generate_statistics: false
    open-in-view: false
  security:
    oauth2:
      client:
        registration:
          keycloak:
            client-id: clientes-cuentas-microservicio
      resourceserver:
        jwt:
          issuer-uri: http://keycloak:8080/realms/empresa-realm
    user:
      name: admin
      password: admin123
logging:
  level:
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
feign:
  client:
    config:
      default:
        connectTimeout: 2000
        readTimeout: 10000
resilience4j:
  circuitbreaker:
    instances:
      clientes-cuentas-microservicio:
        slidingWindowSize: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 5s
  timelimiter:
    instances:
      clientes-cuentas-microservicio:
        timeoutDuration: 2s
  bulkhead:
    instances:
      clientes-cuentas-microservicio:
        maxConcurrentCalls: 10
        maxWaitDuration: 0
client:
  feign:
    audit:
      service:
        url: http://audit-service:8085/api/v1