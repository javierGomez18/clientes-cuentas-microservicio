version: "3.9"

services:
  # ============================
  # CONFIG SERVER
  # ============================
  config-server:
    container_name: config-server
    build:
      context: ..
      dockerfile: ./docker/Dockerfile.config
    environment:
      SPRING_PROFILES_ACTIVE: dev
    ports:
      - "8888:8888"
    networks:
      - backend-net
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8888/actuator/health" ]
      interval: 5s
      timeout: 3s
      retries: 10

  # ============================
  # EUREKA SERVER
  # ============================
  eureka-server:
    container_name: eureka-server
    build:
      context: ..
      dockerfile: ./docker/Dockerfile.eureka
    ports:
      - "8761:8761"
    networks:
      - backend-net
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8761/actuator/health" ]
      interval: 5s
      timeout: 3s
      retries: 10

  # ============================
  # MICROSERVICIO CLIENTES-CUENTAS
  # ============================
  clientes-cuentas-ms:
    container_name: clientes-cuentas-ms
    build:
      context: ../
      dockerfile: ./docker/Dockerfile.micro
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SPRING_CLOUD_CONFIG_URI: http://config-server:8888
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka
    ports:
      - "8080:8080"
    depends_on:
      eureka-server:
        condition: service_healthy
      config-server:
        condition: service_healthy
    networks:
      - backend-net
      - docker_platform-net

  gateway-ms:
    container_name: gateway-server
    build:
      context: ../
      dockerfile: ./docker/Dockerfile.gateway
    environment:
      SPRING_PROFILES_ACTIVE: dev
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka
    ports:
      - "8081:8081"
    depends_on:
      eureka-server:
        condition: service_healthy
      config-server:
        condition: service_started
    networks:
      - backend-net
      - docker_platform-net

# ============================
# RED
# ============================
networks:
  backend-net:
    driver: bridge
  docker_platform-net:
    external: true
